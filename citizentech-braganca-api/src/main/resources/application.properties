spring.application.name=citizentech-braganca-api
server.port=${PORT:8080}

# Oracle FIAP (credenciais SEMPRE por variavel de ambiente)
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle.fiap.com.br}:${DB_PORT:1521}:${DB_SID:orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool pequeno (banco compartilhado da faculdade) e app sobe mesmo sem banco,
# para o /health conseguir mostrar o erro de conexao
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=-1

# O banco ja existe (DDL do Database): a API NAO cria nem altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
